name: FlagShift plan
description: >
  terraform plan for Flagsmith flag changes. Evaluates the live and the proposed
  configuration over your real users inside Postgres (pg_flagsmith) and posts who
  changes, and why, as a pull-request comment.
branding:
  icon: flag
  color: purple
inputs:
  database-url:
    description: >
      Postgres connection string for a role with flagsmith_planner (and SELECT on the population) on the
      primary: plans load the candidate as a snapshot that is never served
    required: true
  environment:
    description: Target environment (key, alias or name), e.g. production
    required: true
  population:
    description: Table or view with identifier text and traits jsonb columns
    required: true
  patch:
    description: Path to an RFC 6902 JSON patch against the target's live configuration
    required: false
  promote-from:
    description: Source environment to promote instead of a patch, e.g. staging
    required: false
  comment:
    description: Post (or update) a pull-request comment with the plan
    default: 'true'
  fail-on-changes:
    description: Fail the step when the plan changes any flag
    default: 'false'
outputs:
  changes:
    description: '"true" when the plan changes at least one flag'
    value: ${{ steps.plan.outputs.changes }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'
    # inputs reach the shell only as environment variables, never spliced into the script
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "$ACTION_PATH/.."
    - id: plan
      shell: bash
      env:
        PGFS_DSN: ${{ inputs.database-url }}
        FS_ENV: ${{ inputs.environment }}
        FS_PATCH: ${{ inputs.patch }}
        FS_PROMOTE_FROM: ${{ inputs.promote-from }}
        FS_POPULATION: ${{ inputs.population }}
      run: |
        set +e
        if [ -n "$FS_PATCH" ]; then src=(--patch "$FS_PATCH"); else src=(--promote-from "$FS_PROMOTE_FROM"); fi
        flagshift plan --env "$FS_ENV" "${src[@]}" --population "$FS_POPULATION" --format markdown > flagshift-plan.md
        rc=$?
        cat flagshift-plan.md >> "$GITHUB_STEP_SUMMARY"
        if [ $rc -eq 1 ]; then exit 1; fi
        echo "changes=$([ $rc -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        { echo '<!-- flagshift-plan -->'; cat flagshift-plan.md; } > body.md
        gh pr comment "$PR_NUMBER" --body-file body.md --edit-last 2>/dev/null \
          || gh pr comment "$PR_NUMBER" --body-file body.md
    - if: inputs.fail-on-changes == 'true' && steps.plan.outputs.changes == 'true'
      shell: bash
      run: echo "FlagShift: this change moves users; review the plan" && exit 1
