name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    name: PostgreSQL ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_PASSWORD: pgfs, POSTGRES_DB: pgfs }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      PGSMITH_DSN: postgresql://postgres:pgfs@localhost:5432/pgfs
      PGSMITH_FUZZ_EXAMPLES: 2000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: python extension/build.py
      - name: Install the extension into the service container
        run: |
          C=$(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }})
          S=$(docker exec $C pg_config --sharedir)
          docker cp extension/dist/pgsmith--$(cat extension/VERSION).sql $C:$S/extension/
          docker cp extension/dist/pgsmith.control $C:$S/extension/
          docker exec $C psql -U postgres -d pgfs -c 'CREATE EXTENSION pgsmith'
      - run: .venv/bin/pytest tests -p no:warnings
  supabase-pgtle:
    name: Supabase (pg_tle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: scripts/matrix.sh supabase | tee matrix.log && ! grep -E "INSTALL FAILED|[0-9]+ failed|[0-9]+ errors?\b" matrix.log
  audit:
    name: Dependency and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: make audit PY=.venv/bin/python
