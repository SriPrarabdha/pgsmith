[project]
name = "pgsmith"
version = "0.1.0"
description = "Tools for pgsmith: sync, live parity check, FlagShift plan/apply, demos and conformance tests"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "psycopg[binary]>=3.2",
  "flagsmith==6.7.0",
  "flagsmith-flag-engine==11.1.2",
  "requests>=2.32.4",                   # CVE-2024-35195, CVE-2024-47081
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "hypothesis>=6.100",
  "json5>=0.9",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[project.scripts]
pgsmith = "pgsmith.cli:main"
flagshift = "pgsmith.flagshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/pgsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
